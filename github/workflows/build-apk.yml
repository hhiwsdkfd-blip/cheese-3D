name: Build Android APK via Capacitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          npx cap add android 2>/dev/null || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/WizardChess-v1.0.apk
          echo "APK successfully generated at output-apk/WizardChess-v1.0.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizardChess-v1.0-APK
          path: output-apk/WizardChess-v1.0.apk
          retention-days: 30